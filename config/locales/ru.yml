  warning_ragged_rows: "Внимание: в файле %{count} стр. содержит больше полей, чем в нём заголовков. Всё, что стоит после лишнего разделителя, прочитано на колонку левее, поэтому значения могли попасть не в те поля. Проверьте файл на незакавыченный разделитель внутри текста."
  warning_multiple_matches_for_update: "Внимание: не удалось обновить задачу %{issue_num} ниже, найдено несколько совпадений для значения %{value}"
