  warning_is_private_not_recognised: "Внимание: «%{value}» — это не «да» и не «нет», признак приватности оставлен без изменений"
  warning_watcher_not_found: "Внимание: при добавлении наблюдателей к задаче %{issue_num} ниже пользователь %{login} не найден"
  warning_custom_field_invalid: "Внимание: при установке кастомного поля %{field_name} для задачи %{issue_num} ниже значение %{value} оказалось недопустимым"
  warning_duplicate_unique_value: "Внимание: уникальное поле %{attr} со значением «%{value}» в задаче %{issue_num} имеет дубликат"
