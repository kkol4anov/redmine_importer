  warning_parent_multiple_matches: "Внимание: при установке родительской задачи для задачи %{issue_num} ниже найдено несколько совпадений для значения %{value}"
  warning_no_match_for_delete: "Внимание: не удалось удалить задачу %{issue_num} ниже, совпадений для значения %{value} не найдено"
  warning_multiple_matches_for_delete: "Внимание: не удалось удалить задачу %{issue_num} ниже, найдено несколько совпадений для значения %{value}"
  warning_unnamed_subtasks_deleted: "Внимание: %{count} задач(и) удалено как подзадачи задач, названных в файле, хотя сам файл их не называл. Redmine удаляет задачу вместе со всем, что под ней."
  warning_duplicate_delete_rows: "Внимание: %{count} стр. называет задачу, уже названную другой строкой, и пропущена."
  warning_issue_not_deletable: "Внимание: задача %{issue_num} ниже (#%{id}) не удалена: у вас нет права удалять задачи в её проекте"
  warning_issue_delete_failed: "Внимание: задачу %{issue_num} ниже (#%{id}) не удалось удалить: %{message}"
