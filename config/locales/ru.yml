ru:
  label_import: "Импорт"
  label_issue_importer: "Импорт задач"
  label_upload_notice: "Выберите CSV файл для импорта. Импортируемый файл должен иметь заголовки колонок. Максимальный размер - 4MB."
  label_upload_format: "Настройки формата файла"
  label_upload_encoding: "Кодировка:"
  label_upload_splitter: "Разделитель:"
  label_upload_wrapper: "Формат кавычек:"

  label_load_rules: "Загрузить сохраненные правила"
  label_toplines: "Первые строки файла %{value}:"
  label_match_columns: "Привязка колонок"
  label_match_select: "Задайте соответствие полей:"
  label_import_rule: "Правила импортра"
  label_default_tracker: "Трекер по умолчанию"
  label_importer_send_emails: "Уведомить участников по e-mail"
  label_importer_add_categories: "Создать несуществующие категории"
  label_importer_add_versions: "Создать несуществующие версии"
  label_clear_empty_cells: "Пустая ячейка очищает поле"
  label_clear_empty_cells_info: "По умолчанию пустая ячейка в привязанной колонке ничего не говорит о поле и оставляет значение задачи как есть, поэтому файл, заполненный местами, обновляет только то, что в нём есть. Включите, чтобы каждая пустая ячейка очищала своё поле. В обоих случаях ячейка со значением %{marker} очищает поле намеренно; сам маркер никуда не записывается. Он не применяется к теме, трекеру, статусу и приоритету, которые обязательны в Redmine, а также к наблюдателям и связанным задачам, куда импорт только добавляет."
  label_importer_use_anonymous: "Заменять неизвестных пользователей анонимным пользователем"
  label_importer_use_issue_id: "Импорт с использованием ID задач"
  label_importer_use_issue_id_info: "Id новых задач берутся из колонки, привязанной к полю Id; существующие задачи также сопоставляются по Id. Id уникален сам по себе, поэтому настройки уникальных значений ниже не применяются и отключаются, пока опция включена."
  label_update_issue: "Обновлять существующие задачи, остальные создавать"
  label_update_issue_info: "Режим загрузки по умолчанию: строка, задача которой уже есть в Redmine, обновляет её, а строка, задачи которой нет, создаёт новую. Снимите галочку, чтобы все строки загружались как новые задачи. Чтобы отличить одно от другого, нужна колонка с уникальными значениями (или импорт по id задач); пока её нет, опция отключена."
  label_journal_field: "Выберите колонку используемую как описание:"
  label_unique_field: "Уникальные значения"
  label_unique_field_info: "Колонка, значения которой однозначно определяют задачу. Необходима для обновления существующих задач и для импорта колонок, ссылающихся на другие задачи (родительская задача, связанные задачи). Если задачи только создаются, оставьте «Игнорировать»."
  label_unique_scope_tracker: "Сопоставлять уникальные значения в пределах трекера строки"
  label_unique_scope_tracker_info: "Трекер строки берётся из привязанной колонки, а при её отсутствии или пустом значении — из трекера по умолчанию выше. Отключите, если импорт должен менять трекер существующих задач, иначе они не будут найдены. Не применяется, если колонка с уникальными значениями привязана к id задачи."
  label_unique_scope_fields: "Границы поиска уникальных значений"
  label_unique_scope_fields_info: "Уникальные значения сопоставляются в пределах проекта. Выберите одно или несколько кастомных полей, чтобы сопоставление выполнялось также в пределах их значений. Поля должны быть привязаны к колонкам CSV и иметь включённую опцию «Используется как фильтр». Не применяется, если колонка с уникальными значениями привязана к id задачи."
  label_extract_unique_value: "Извлекать идентификатор из текста колонки с уникальными значениями"
  label_extract_unique_value_info: "Значения ожидаются в формате «<текст> | <код>». Сопоставляется только код, поэтому задачи продолжают находиться после правки текстовой части. Метки в квадратных скобках, стоящие после кода через пробел (например «| ABC-123 [ДУБЛЬ]»), игнорируются. В колонках со ссылками на другие задачи (родительская задача, связанные задачи) можно указывать как ту же пару, так и один код. Доступно только для текстовых полей (Тема, Описание, кастомные поля string/text/link)."
  label_unique_value_separator: "Разделитель:"
  label_unique_value_part: "Расположение идентификатора:"
  label_unique_value_part_last: "после разделителя (последняя часть)"
  label_unique_value_part_first: "до разделителя (первая часть)"
  label_unique_value_keep_whole: "Использовать значение целиком, если разделитель не найден"
  label_update_other_project: "Разрешить доступ к задачам других проектов"
  label_update_other_project_info: "Задача, найденная по id, может находиться в любом проекте. Без этой опции такая строка пропускается; с включённой опцией задача обновляется, а в режиме удаления — удаляется."
  label_ignore_non_exist: "Игнорировать несуществующие задачи"
  label_ignore_non_exist_info: "Строка, для которой не найдено совпадений, молча пропускается вместо загрузки. В обычном режиме это сводит импорт только к обновлению, ничего нового не создаётся; в режиме удаления — не даёт строкам, задачи которых уже удалены, попасть в ошибки."
  label_delete_issues: "Режим удаления: удалять найденные задачи"
  label_delete_issues_info: "Строки указывают задачи для удаления, ничего в них не записывается, поэтому опции, относящиеся только к записи, отключаются. Задачи ищутся так же, как при обновлении, поэтому нужна колонка с уникальными значениями (или импорт по id задач). Задача удаляется вместе с подзадачами, и в её проекте требуется право на удаление задач. Отменить удаление нельзя."
  label_rule_name: "Название правила"

  label_import_result: "Результат импорта"
  label_result_notice: "%{handle_count} задач(а) обработано.  %{success_count} задач(а) была успешно импортирована."
  label_result_projects: "Затронуто проектов:"
  label_result_issues: "%{count} задач(а)"
  label_result_failed: "Пропущено %{count} строк(а):"
  label_result_messages: "Сообщения"

  option_ignore: "Игнорировать"

  button_upload: "Загрузить файл"
  button_redmine_importer_submit: "Импортировать"
  button_save_rules_and_submit: "Сохранить правила привязки и импортировать"

  text_rmi_specify_unique_field_for_update: "Колонка с уникальными значениями должна быть определена, так как включён режим обновления существующих задач"
  text_rmi_specify_unique_field_for_column: "Колонка с уникальными значениями должна быть определена, так как колонка %{column} ссылается на другие задачи"
  flash_csv_file_is_blank: "CSV-файл пуст."

  label_max_csv_rows: "Максимальное количество строк CSV"
  text_max_csv_rows_info: "Максимальное количество строк, допустимое при импорте CSV (без учёта строки заголовка)"
  error_csv_row_limit_exceeded: "CSV-файл превышает максимально допустимое количество строк. Максимум: %{max_rows}, фактически: %{actual_rows}"
  error_max_csv_rows_invalid: "Максимальное количество строк CSV должно быть положительным целым числом"

  error_no_import_in_progress: "Сейчас нет выполняющегося импорта"
  error_import_superseded: "Похоже, после начала этого импорта был запущен другой. Этот импорт не может быть завершён"
  error_import_already_done: "Этот импорт уже выполнен. Чтобы повторить его, загрузите файл заново"
  error_must_map_id_column: "При импорте с использованием ID задач необходимо привязать колонку к полю id."
  warning_delete_without_unique_field: "Нечем сопоставить задачи: выберите колонку с уникальными значениями выше или включите импорт по id задач."
  warning_id_column_not_mapped: "В разделе «Задайте соответствие полей» ни одна колонка не привязана к полю Id. Считать Id задач неоткуда."
  error_issue_id_taken: "Этот ID задачи уже занят."
  error_csv_no_data: "В CSV-файле нет строк с данными, проверьте кодировку файла"
  error_csv_missing_headers: "Отсутствует заголовок колонки: %{columns} / %{total}"
  error_encoding_mismatch: "Кодировка файла не совпадает с выбранной кодировкой. Выберите правильную кодировку и загрузите файл заново."
  error_unique_field_not_usable: "Колонка '%{field}' не может быть использована в качестве уникального поля: это кастомное поле не используется в качестве фильтра."
  error_unique_scope_field_not_usable: "Кастомное поле '%{field}' не может использоваться для ограничения области сопоставления: фильтр по нему недоступен (вероятно, отключена опция «Используется как фильтр»)."
  error_matching_column_not_in_file: "Задачи сопоставляются по колонке «%{column}», а такого заголовка в файле нет. Ничего не было бы найдено, и весь файл загрузился бы как новые задачи, поэтому импорт не выполнен. Загрузите файл заново и настройте правила для него."
  error_duplicate_field_mapping: "К полю '%{field}' привязано несколько колонок: %{columns}. Импортирована была бы только одна из них, оставьте одну привязку."
  error_unique_scope_field_not_mapped: "Кастомное поле '%{field}' не может использоваться для ограничения области сопоставления: оно не привязано ни к одной колонке CSV-файла."
  error_extraction_without_unique_field: "Колонка с уникальными значениями должна быть сопоставлена с полем, из текста которого извлекается идентификатор."
  error_delete_requires_unique_field: "Для режима удаления нужно сопоставление задач: выберите колонку с уникальными значениями или включите импорт по id задач."
  error_unique_field_not_text: "Колонка '%{field}' сопоставлена с нетекстовым полем, извлечь из неё идентификатор невозможно."
  warning_update_disabled_without_unique_field: "Внимание: колонка с уникальными значениями не выбрана, сопоставлять существующие задачи не с чем. Всё содержимое файла загружено как новые задачи."
  warning_unique_value_not_extracted: "Внимание: из значения '%{value}' в колонке '%{column}' не удалось извлечь идентификатор, ссылаться на эту задачу внутри файла нельзя"
  warning_reference_value_not_extracted: "Внимание: из ссылки '%{value}' в колонке '%{column}' не удалось извлечь идентификатор, ссылка пропущена"
  warning_extraction_too_many_candidates: "Внимание: значение '%{value}' встречается более чем в %{limit} задачах, сопоставление может быть неполным"
  warning_record_not_found: "Внимание: при добавлении задачи %{issue_num} ниже не найдено: %{class_name} %{key}"
  warning_invalid_value: "Внимание: при добавлении задачи %{issue_num} ниже значение %{value} недопустимо."
  warning_validation_errors: "Внимание: при проверке данных задачи %{issue_num} в списке ниже возникли следующие ошибки"
