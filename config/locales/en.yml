  error_max_csv_rows_invalid: "Maximum CSV rows must be a positive integer"

  error_no_import_in_progress: "No import is currently in progress"
  error_import_superseded: "You seem to have started another import since starting this one. This import cannot be completed"
  error_import_already_done: "This import has already been performed. Upload the file again to import it once more"
  error_must_map_id_column: "You must specify a column mapping for id when importing using provided issue ids."
  warning_delete_without_unique_field: "No unique values to match the issues by: choose the column above or turn the import by issue ids on."
  warning_id_column_not_mapped: "No column is mapped to the id above, in \"Select field to set from each column\". The ids cannot be read until one is."
  error_issue_id_taken: "This issue id has already been taken."
  error_csv_no_data: "No data line in your CSV, check the encoding of the file"
  error_csv_missing_headers: "Column header missing: %{columns} / %{total}"
  error_encoding_mismatch: "The file encoding does not match the selected character encoding. Please select the correct character encoding and upload again."
  error_unique_field_not_usable: "Column '%{field}' cannot be used as unique field: no such filter is available."
  error_unique_scope_field_not_usable: "Custom field '%{field}' cannot be used to narrow the matching down: no such filter is available (the \"Used as a filter\" option is probably disabled)."
  error_matching_column_not_in_file: "The issues are matched by the column '%{column}', which the file has no header for. Nothing would be found and the whole file would be imported as new issues, so it was not imported at all. Upload the file again and set the rules up for it."
  error_duplicate_field_mapping: "Several columns are mapped to the field '%{field}': %{columns}. Only one of them would be imported, leave a single mapping."
  error_unique_scope_field_not_mapped: "Custom field '%{field}' cannot be used to narrow the matching down: it is not mapped to any column of the CSV file."
  error_extraction_without_unique_field: "The unique-valued column must be mapped to a field to extract the identifier from its text."
  error_delete_requires_unique_field: "The deletion mode needs the issues to be matched: choose the column with the unique values or import by issue ids."
  error_unique_field_not_text: "Column '%{field}' is mapped to a non-text field, the identifier cannot be extracted from it."

  warning_update_disabled_without_unique_field: "Warning: no column with the unique values is chosen, so there is nothing to match the existing issues by. Everything in the file was imported as new issues."
  warning_unique_value_not_extracted: "Warning: no identifier could be extracted from the value '%{value}' of the column '%{column}', the issue cannot be referred to from within the file"
  warning_reference_value_not_extracted: "Warning: no identifier could be extracted from the reference '%{value}' of the column '%{column}', the reference was skipped"
  warning_extraction_too_many_candidates: "Warning: more than %{limit} issues contain the value '%{value}', the matching may be incomplete"
  warning_record_not_found: "Warning: When adding issue %{issue_num} below, the %{class_name} %{key} was not found"
  warning_invalid_value: "Warning: When adding issue %{issue_num} below, %{value} is not a valid value."
  warning_validation_errors: "Warning: The following data-validation errors occurred on issue %{issue_num} in the list below"
  warning_attr_error: "Error: %{attr} %{message}"
  warning_no_match_for_update: "Warning: Could not update issue %{issue_num} below, no match for the value %{value} was found"
  warning_no_unique_value_to_match: "Warning: Row %{issue_num} below carries no value in the column '%{column}' the issues are matched by, so it says nothing about which issue it is about and was not imported. A truncated line of the file looks like this."
  warning_ragged_rows: "Warning: %{count} row(s) of the file carry more fields than the file has headers. Everything past the extra separator was read one column to the left, so the values may have been put into the wrong fields. Check the file for an unquoted separator inside the text."
  warning_multiple_matches_for_update: "Warning: Could not update issue %{issue_num} below, multiple matches for the value %{value} were found"
  warning_parent_not_found: "Warning: When setting the parent for issue %{issue_num} below, no matches for the value %{value} were found"
  warning_parent_multiple_matches: "Warning: When setting the parent for issue %{issue_num} below, multiple matches for the value %{value} were found"
  warning_no_match_for_delete: "Warning: Could not delete issue %{issue_num} below, no match for the value %{value} was found"
  warning_multiple_matches_for_delete: "Warning: Could not delete issue %{issue_num} below, multiple matches for the value %{value} were found"
  warning_unnamed_subtasks_deleted: "Warning: %{count} issue(s) were deleted as subtasks of the issues the file names, without being named by it themselves. Redmine deletes an issue together with everything under it."
  warning_duplicate_delete_rows: "Warning: %{count} row(s) name an issue another row already names and were skipped."
  warning_issue_not_deletable: "Warning: Issue %{issue_num} below (#%{id}) was not deleted: you are not allowed to delete issues in its project"
  warning_issue_delete_failed: "Warning: Issue %{issue_num} below (#%{id}) could not be deleted: %{message}"
  warning_clear_marker_ignored: "Warning: the %{marker} marker was met in the column '%{column}', which cannot be emptied, and was ignored"
  warning_is_private_not_recognised: "Warning: '%{value}' is neither yes nor no, the private flag was left as it was"
  warning_watcher_not_found: "Warning: When trying to add watchers on issue %{issue_num} below, User %{login} was not found"
  warning_custom_field_invalid: "Warning: When trying to set custom field %{field_name} on issue %{issue_num} below, value %{value} was invalid"
  warning_duplicate_unique_value: "Warning: Unique field %{attr} with value '%{value}' in issue %{issue_num} has duplicate record"

