  label_import: "Import"
  label_issue_importer: "Issue Importer"
  label_upload_notice: "Select a CSV file to import. Import file must have a header row. Maximum size 4MB."
  label_upload_format: "File format settings"
  label_upload_encoding: "Encoding:"
  label_upload_splitter: "Field separator character:"
  label_upload_wrapper: "Field quoting character:"

  label_load_rules: "Load saved rules"
  label_toplines: "Refer to top lines of %{value}："
  label_match_columns: "Matching Columns"
  label_match_select: "Select field to set from each column:"
  label_import_rule: "Import rules"
  label_default_tracker: "Default tracker"
  label_importer_send_emails: "Send notification emails"
  label_importer_add_categories: "Auto-add categories"
  label_importer_add_versions: "Auto-add target versions"
  label_clear_empty_cells: "An empty cell empties the field"
  label_clear_empty_cells_info: "By default an empty cell in a mapped column says nothing about the field and leaves what the issue holds alone, so that a file filled in only here and there updates only what it carries. Turn this on to have every empty cell empty its field. Either way a cell holding %{marker} empties its field on purpose; the marker itself is never written anywhere. It does not apply to the subject, the tracker, the status and the priority, which Redmine requires, nor to the watchers and the related issues, which the import only ever adds to."
  label_importer_use_anonymous: "Substitute unknown users with the Anonymous user"
  label_importer_use_issue_id: "Import using issue ids"
  label_importer_use_issue_id_info: "The ids of the new issues are taken from the column mapped to the id, and the existing issues are matched by their id as well. An id is unique by itself, so the unique values settings below do not apply and are switched off while this option is on."
  label_update_issue: "Update the existing issues, create the rest"
  label_update_issue_info: "The default way of importing: a row whose issue is already in Redmine updates it, a row whose issue is not there yet creates it. Turn it off to create everything as new issues. Needs a column with the unique values (or the import by issue ids) to tell the one from the other, and is switched off while there is none."
  label_journal_field: "Select column to use as note:"
  label_unique_field: "Unique values"
  label_unique_field_info: "The column whose values identify an issue uniquely. Required for updating the existing issues and for importing the columns that refer to other issues (parent issue, related issues). Leave it ignored for a plain creation of new issues."
  label_unique_scope_tracker: "Match the unique values within the tracker of the row"
  label_unique_scope_tracker_info: "The tracker of the row is taken from the mapped column and falls back to the default tracker above. Turn this off when the import has to change the tracker of the existing issues, otherwise they will not be found. Not used when the unique column is mapped to the issue id."
  label_unique_scope_fields: "Unique values matching scope"
  label_unique_scope_fields_info: "The unique values are matched within the project only. Select one or several custom fields to match the values within the given values of these fields as well. The fields have to be mapped to the columns of the CSV file and have the \"Used as a filter\" option enabled. Not used when the unique column is mapped to the issue id."
  label_extract_unique_value: "Extract the identifier from the text of the unique column"
  label_extract_unique_value_info: "The values are expected in the \"<text> | <code>\" format. Only the code is matched, so the issues keep matching after the text part has been edited. Marks in square brackets following the code and separated from it by a space (e.g. \"| ABC-123 [DUPLICATE]\") are ignored. The columns referring to other issues (parent issue, related issues) may hold either the same pair or the bare code. Available for the text fields only (Subject, Description, string/text/link custom fields)."
  label_unique_value_separator: "Separator:"
  label_unique_value_part: "Identifier position:"
  label_unique_value_part_last: "after the separator (last part)"
  label_unique_value_part_first: "before the separator (first part)"
  label_unique_value_keep_whole: "Use the whole value when the separator is not found"
  label_update_other_project: "Allow reaching issues of other projects"
  label_update_other_project_info: "An issue matched by its id may live in any project. Without this option such a row is skipped; with it on the issue is updated, or deleted when the deletion mode is on."
  label_ignore_non_exist: "Ignore non-existant issues"
  label_ignore_non_exist_info: "A row no issue matches is skipped silently instead of being imported. In the ordinary mode this narrows the import down to the update alone, so that nothing new is created; in the deletion mode it keeps the rows whose issues are already gone out of the errors."
  label_delete_issues: "Deletion mode: delete the matched issues"
  label_delete_issues_info: "The rows name the issues to delete and nothing is written to them, so the options that only apply to writing are switched off. The issues are matched the same way as for the update, so a column with the unique values (or the import by issue ids) is required. An issue is deleted together with its subtasks, and the permission to delete issues is required in its project. The deletion cannot be undone."
  label_rule_name: "Input rule name"

  label_import_result: "Import Result"
  label_result_notice: "%{handle_count} issues processed.  %{success_count} issues successfully imported."
  label_result_projects: "Affected projects:"
  label_result_issues: "%{count} issues"
  label_result_failed: "Failed rows (%{count})"
  label_result_messages: "Messages"

  option_ignore: "Ignore"

